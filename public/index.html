<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f4efe8"
    >

    <title>My Photobooth</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <main class="app">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <h1>&ROLLING</h1>

            <p>
                Choose your look & capture the moment.
            </p>

        </header>



        <!-- =========================
             CAMERA
        ========================== -->

        <section class="camera-section">

            <div class="camera-wrapper">

                <video
                    id="camera"
                    autoplay
                    playsinline
                    muted
                ></video>

                <canvas
                    id="canvas"
                ></canvas>


                <!-- COUNTDOWN -->

                <div
                    id="countdown"
                    class="countdown hidden"
                ></div>

            </div>



            <!-- CAMERA CONTROLS -->

            <div class="camera-controls">

                <button
                    id="switchCamera"
                    class="small-button"
                    type="button"
                >
                    ↻ Switch Camera
                </button>

            </div>



            <!-- =========================
                 FILTERS
            ========================== -->

            <section class="filters">

                <h2>Choose your look</h2>


                <div class="filter-buttons">


                    <button
                        class="filter-button active"
                        data-filter="normal"
                        type="button"
                    >
                        Normal
                    </button>


                    <button
                        class="filter-button"
                        data-filter="retro"
                        type="button"
                    >
                        Retro B&W
                    </button>


                    <button
                        class="filter-button"
                        data-filter="y2k"
                        type="button"
                    >
                        Y2K
                    </button>


                    <button
                        class="filter-button"
                        data-filter="film"
                        type="button"
                    >
                        Fujifilm
                    </button>


                    <button
                        class="filter-button"
                        data-filter="glow"
                        type="button"
                    >
                        Glow
                    </button>


                </div>

            </section>



            <!-- =========================
                 TAKE PHOTO
            ========================== -->

            <button
                id="takePhoto"
                class="take-photo"
                type="button"
                aria-label="Take photo"
            >

                <span></span>

            </button>


        </section>



        <!-- =========================
             RESULT
        ========================== -->

        <section
            id="resultSection"
            class="result-section hidden"
        >

            <h2>Your Photo</h2>


            <div class="photo-container">

                <img
                    id="photoResult"
                    alt="Your photobooth photo"
                >

            </div>


            <div class="result-buttons">

                <button
                    id="retake"
                    class="secondary-button"
                    type="button"
                >
                    Retake
                </button>


                <button
                    id="download"
                    class="primary-button"
                    type="button"
                >
                    Download Photo
                </button>

            </div>

        </section>



        <!-- =========================
             FOOTER
        ========================== -->

        <footer>

            <p>
                Made with ♡
            </p>

        </footer>


    </main>


    <script src="script.js"></script>

</body>

</html>
